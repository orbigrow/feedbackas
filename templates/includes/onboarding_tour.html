{% load i18n %}
{% if user.is_authenticated and not user.is_superuser %}
<!-- Onboarding Tour Component -->
<div id="onboarding-tour-root" class="hidden relative">
    <!-- SVG Mask Backdrop for Spotlight Hole -->
    <svg id="tour-backdrop-svg" class="fixed inset-0 w-full h-full pointer-events-auto transition-opacity duration-300" style="z-index: 9990;" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <mask id="tour-spotlight-mask">
                <!-- White everywhere (opaque = dark backdrop visible) -->
                <rect x="0" y="0" width="100%" height="100%" fill="white" />
                <!-- Black cutout for highlighted target (transparent hole) -->
                <rect id="tour-mask-cutout" x="0" y="0" width="0" height="0" rx="14" ry="14" fill="black"
                      style="transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);" />
            </mask>
        </defs>
        <!-- The darkened dimmed background layer with mask -->
        <rect x="0" y="0" width="100%" height="100%" fill="rgba(15, 23, 42, 0.78)" mask="url(#tour-spotlight-mask)" />
    </svg>

    <!-- Glowing spotlight border around the target element -->
    <div id="tour-highlight-box"
         class="fixed pointer-events-none rounded-xl border-2 border-primary shadow-[0_0_25px_rgba(79,70,229,0.45)] ring-4 ring-primary/20 transition-all duration-350 opacity-0"
         style="z-index: 9992; transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);"></div>

    <!-- Tour Popover / Card -->
    <div id="tour-card"
         class="fixed bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-2xl p-6 transition-all duration-300 opacity-0 scale-95"
         style="z-index: 9995; max-width: 440px; width: calc(100vw - 32px);">

        <!-- Header: Badge & Skip button -->
        <div class="flex items-center justify-between gap-2 mb-3">
            <div class="flex items-center gap-2">
                <span id="tour-step-badge" class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-primary/10 text-primary">
                    1 iš 7
                </span>
                <span id="tour-category-tag" class="text-xs font-medium text-slate-400 dark:text-slate-500 uppercase tracking-wider">
                    Gidas
                </span>
            </div>
            <button type="button" onclick="window.dismissOnboardingTour(true)"
                    class="text-xs font-medium text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors cursor-pointer py-1 px-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">
                {% trans "Praleisti turą" %}
            </button>
        </div>

        <!-- Step Content -->
        <div class="flex items-start gap-4 mb-5">
            <div id="tour-icon-container" class="shrink-0 w-12 h-12 rounded-xl bg-primary/10 flex items-center justify-center text-primary text-xl">
                <!-- Icon injected dynamically -->
            </div>
            <div class="flex-1 min-w-0">
                <h3 id="tour-title" class="text-lg font-bold text-slate-900 dark:text-white leading-snug">
                    Sveiki atvykę!
                </h3>
                <p id="tour-description" class="text-sm text-slate-600 dark:text-slate-300 mt-1.5 leading-relaxed">
                    Trumpas sistemos funkcijų pristatymas.
                </p>
            </div>
        </div>

        <!-- Footer: Progress Dots & Actions -->
        <div class="flex items-center justify-between pt-3 border-t border-slate-100 dark:border-slate-800/80 mt-2">
            <!-- Progress Dots -->
            <div id="tour-dots" class="flex items-center space-x-1.5">
                <!-- Dots generated in JS -->
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center space-x-2">
                <button type="button" id="tour-btn-prev" onclick="window.prevTourStep()"
                        class="px-3.5 py-2 text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl transition-colors hidden cursor-pointer">
                    {% trans "Atgal" %}
                </button>
                <button type="button" id="tour-btn-next" onclick="window.nextTourStep()"
                        class="px-5 py-2 text-xs font-semibold text-white bg-primary hover:bg-primary/90 rounded-xl shadow-md hover:shadow-lg transition-all flex items-center gap-1.5 cursor-pointer">
                    <span id="tour-btn-next-text">{% trans "Kitas" %}</span>
                    <svg class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
                    </svg>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    // Check if user has already completed the tour
    const userCompletedTour = {{ user.profile.has_completed_tour|yesno:"true,false" }};
    const urlParams = new URLSearchParams(window.location.search);
    const forceStart = urlParams.get('start_tour') === '1' || sessionStorage.getItem('orbigrow_restart_tour') === '1';

    if (sessionStorage.getItem('orbigrow_restart_tour') === '1') {
        sessionStorage.removeItem('orbigrow_restart_tour');
    }

    const tourSteps = [
        {
            id: 'welcome',
            target: null, // Centered modal
            category: '{% trans "Įvadas" %}',
            title: '{% if LANGUAGE_CODE == "en" and page_description.tour_welcome_title_en %}{{ page_description.tour_welcome_title_en|escapejs }}{% elif page_description.tour_welcome_title %}{{ page_description.tour_welcome_title|escapejs }}{% else %}{% trans "Sveiki atvykę į Orbigrow!" %}{% endif %}',
            description: '{% if LANGUAGE_CODE == "en" and page_description.tour_welcome_desc_en %}{{ page_description.tour_welcome_desc_en|escapejs }}{% elif page_description.tour_welcome_desc %}{{ page_description.tour_welcome_desc|escapejs }}{% else %}{% trans "Tai jūsų komandos 360° grįžtamojo ryšio ir kompetencijų auginimo sistema. Skirkite 1 minutę susipažinti su svarbiausiomis funkcijomis." %}{% endif %}',
            icon: `<svg class="w-6 h-6 text-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.59 14.37a6 6 0 0 1-5.84 7.38v-4.8m5.84-2.58a14.98 14.98 0 0 0 6.16-12.12A14.98 14.98 0 0 0 9.631 8.41m5.96 5.96a14.926 14.926 0 0 1-5.841 2.58m-.119-8.54a6 6 0 0 0-7.381 5.84h4.8m2.58-5.84a14.927 14.927 0 0 0-2.58 5.84m2.699 2.7c-.103.021-.207.041-.311.06a15.09 15.09 0 0 1-2.448-2.448 14.9 14.9 0 0 1 .06-.312m-2.24 2.39a4.493 4.493 0 0 0-1.757 4.306 4.493 4.493 0 0 0 4.306-1.758M16.5 9a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Z" />
                   </svg>`,
            btnText: '{% if LANGUAGE_CODE == "en" and page_description.tour_welcome_btn_en %}{{ page_description.tour_welcome_btn_en|escapejs }}{% elif page_description.tour_welcome_btn %}{{ page_description.tour_welcome_btn|escapejs }}{% else %}{% trans "Pradėti turą" %}{% endif %}'
        },
        {
            id: 'request_feedback',
            targets: ['#tour-btn-request', '#tour-btn-request-mobile'],
            category: '{% trans "Grįžtamasis ryšys" %}',
            title: '{% if LANGUAGE_CODE == "en" and page_description.tour_request_title_en %}{{ page_description.tour_request_title_en|escapejs }}{% elif page_description.tour_request_title %}{{ page_description.tour_request_title|escapejs }}{% else %}{% trans "Prašykite įvertinimo" %}{% endif %}',
            description: '{% if LANGUAGE_CODE == "en" and page_description.tour_request_desc_en %}{{ page_description.tour_request_desc_en|escapejs }}{% elif page_description.tour_request_desc %}{{ page_description.tour_request_desc|escapejs }}{% else %}{% trans "Norite sužinoti, kaip sekėsi įgyvendinti projektą ar užduotį? Spustelėkite šį mygtuką, pasirinkite kolegas bei klausimyną ir išsiųskite prašymą." %}{% endif %}',
            icon: `<svg class="w-6 h-6 text-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                   </svg>`,
            preferredPosition: 'bottom'
        },
        {
            id: 'send_feedback',
            targets: ['#tour-btn-send', '#tour-btn-send-mobile'],
            category: '{% trans "Grįžtamasis ryšys" %}',
            title: '{% if LANGUAGE_CODE == "en" and page_description.tour_send_title_en %}{{ page_description.tour_send_title_en|escapejs }}{% elif page_description.tour_send_title %}{{ page_description.tour_send_title|escapejs }}{% else %}{% trans "Siųskite įvertinimą bet kada" %}{% endif %}',
            description: '{% if LANGUAGE_CODE == "en" and page_description.tour_send_desc_en %}{{ page_description.tour_send_desc_en|escapejs }}{% elif page_description.tour_send_desc %}{{ page_description.tour_send_desc|escapejs }}{% else %}{% trans "Pastebėjote puikų kolegos darbą ar pagalbą? Nelaukite prašymo – proaktyviai išreikškite padėką ar pateikite vertingų įžvalgų." %}{% endif %}',
            icon: `<svg class="w-6 h-6 text-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 12 3.269 3.125A59.769 59.769 0 0 1 21.485 12 59.768 59.768 0 0 1 3.27 20.875L5.999 12Zm0 0h7.5" />
                   </svg>`,
            preferredPosition: 'bottom'
        },
        {
            id: 'tasks',
            targets: ['#tour-nav-tasks', '#mobile-tour-nav-tasks'],
            category: '{% trans "Navigacija" %}',
            title: '{% if LANGUAGE_CODE == "en" and page_description.tour_tasks_title_en %}{{ page_description.tour_tasks_title_en|escapejs }}{% elif page_description.tour_tasks_title %}{{ page_description.tour_tasks_title|escapejs }}{% else %}{% trans "Mano Užduotys" %}{% endif %}',
            description: '{% if LANGUAGE_CODE == "en" and page_description.tour_tasks_desc_en %}{{ page_description.tour_tasks_desc_en|escapejs }}{% elif page_description.tour_tasks_desc %}{{ page_description.tour_tasks_desc|escapejs }}{% else %}{% trans "Čia matysite visus kolegų atsiųstus prašymus įvertinti jų darbą. Stebėkite terminus ir patogiai pildykite atsakymus." %}{% endif %}',
            icon: `<svg class="w-6 h-6 text-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25ZM6.75 12h.008v.008H6.75V12Zm0 3h.008v.008H6.75V15Zm0 3h.008v.008H6.75V18Z" />
                   </svg>`,
            preferredPosition: 'right'
        },
        {
            id: 'results',
            targets: ['#tour-nav-results', '#mobile-tour-nav-results'],
            category: '{% trans "Kompetencijos" %}',
            title: '{% if LANGUAGE_CODE == "en" and page_description.tour_results_title_en %}{{ page_description.tour_results_title_en|escapejs }}{% elif page_description.tour_results_title %}{{ page_description.tour_results_title|escapejs }}{% else %}{% trans "Rezultatai ir tobulėjimas" %}{% endif %}',
            description: '{% if LANGUAGE_CODE == "en" and page_description.tour_results_desc_en %}{{ page_description.tour_results_desc_en|escapejs }}{% elif page_description.tour_results_desc %}{{ page_description.tour_results_desc|escapejs }}{% else %}{% trans "Jūsų asmeninė kompetencijų statistika: interaktyvus radaras, stiprybės, tobulintinos sritys bei AI sugeneruotos įžvalgos." %}{% endif %}',
            icon: `<svg class="w-6 h-6 text-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z" />
                   </svg>`,
            preferredPosition: 'right'
        },
        {
            id: 'team',
            targets: ['#tour-nav-team', '#mobile-tour-nav-team'],
            category: '{% trans "Komanda" %}',
            title: '{% if LANGUAGE_CODE == "en" and page_description.tour_team_title_en %}{{ page_description.tour_team_title_en|escapejs }}{% elif page_description.tour_team_title %}{{ page_description.tour_team_title|escapejs }}{% else %}{% trans "Mano Komanda" %}{% endif %}',
            description: '{% if LANGUAGE_CODE == "en" and page_description.tour_team_desc_en %}{{ page_description.tour_team_desc_en|escapejs }}{% elif page_description.tour_team_desc %}{{ page_description.tour_team_desc|escapejs }}{% else %}{% trans "Komandos narių sąrašas ir jų profiliai. Galite tiesiogiai peržiūrėti bendradarbių atvirą informaciją bei siųsti jiems įvertinimus." %}{% endif %}',
            icon: `<svg class="w-6 h-6 text-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z" />
                   </svg>`,
            preferredPosition: 'right'
        },
        {
            id: 'finish',
            target: null, // Centered modal
            category: '{% trans "Pabaiga" %}',
            title: '{% if LANGUAGE_CODE == "en" and page_description.tour_finish_title_en %}{{ page_description.tour_finish_title_en|escapejs }}{% elif page_description.tour_finish_title %}{{ page_description.tour_finish_title|escapejs }}{% else %}{% trans "Viskas paruošta!" %}{% endif %}',
            description: '{% if LANGUAGE_CODE == "en" and page_description.tour_finish_desc_en %}{{ page_description.tour_finish_desc_en|escapejs }}{% elif page_description.tour_finish_desc %}{{ page_description.tour_finish_desc|escapejs }}{% else %}{% trans "Sveikiname susipažinus su Orbigrow. Bet kada prireikus peržiūrėti šį turą iš naujo, jį rasite savo Profilio puslapyje." %}{% endif %}',
            icon: `<svg class="w-6 h-6 text-emerald-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                   </svg>`,
            btnText: '{% if LANGUAGE_CODE == "en" and page_description.tour_finish_btn_en %}{{ page_description.tour_finish_btn_en|escapejs }}{% elif page_description.tour_finish_btn %}{{ page_description.tour_finish_btn|escapejs }}{% else %}{% trans "Pradėti darbą" %}{% endif %}'
        }
    ];

    let currentStepIndex = 0;
    let isTourActive = false;

    function getTargetElement(step) {
        if (!step.targets) return null;
        for (const selector of step.targets) {
            const el = document.querySelector(selector);
            // Must be visible and in viewport or DOM
            if (el && (el.offsetWidth > 0 || el.offsetHeight > 0)) {
                return el;
            }
        }
        return null;
    }

    function renderTourStep(index) {
        if (index < 0 || index >= tourSteps.length) return;
        currentStepIndex = index;

        const step = tourSteps[index];
        const root = document.getElementById('onboarding-tour-root');
        const card = document.getElementById('tour-card');
        const maskCutout = document.getElementById('tour-mask-cutout');
        const highlightBox = document.getElementById('tour-highlight-box');
        const badge = document.getElementById('tour-step-badge');
        const tag = document.getElementById('tour-category-tag');
        const title = document.getElementById('tour-title');
        const desc = document.getElementById('tour-description');
        const iconContainer = document.getElementById('tour-icon-container');
        const dotsContainer = document.getElementById('tour-dots');
        const btnPrev = document.getElementById('tour-btn-prev');
        const btnNext = document.getElementById('tour-btn-next');
        const btnNextText = document.getElementById('tour-btn-next-text');

        // Update Text & Badges
        badge.textContent = `${index + 1} iš ${tourSteps.length}`;
        tag.textContent = step.category || '{% trans "Gidas" %}';
        title.textContent = step.title;
        desc.textContent = step.description;
        iconContainer.innerHTML = step.icon;

        if (step.id === 'finish') {
            iconContainer.className = 'shrink-0 w-12 h-12 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 flex items-center justify-center text-emerald-600';
        } else {
            iconContainer.className = 'shrink-0 w-12 h-12 rounded-xl bg-primary/10 flex items-center justify-center text-primary';
        }

        // Prev / Next button states
        if (index === 0) {
            btnPrev.classList.add('hidden');
        } else {
            btnPrev.classList.remove('hidden');
        }

        if (step.btnText) {
            btnNextText.textContent = step.btnText;
        } else {
            btnNextText.textContent = '{% trans "Kitas" %}';
        }

        // Render Dots
        dotsContainer.innerHTML = '';
        tourSteps.forEach((s, idx) => {
            const dot = document.createElement('button');
            dot.type = 'button';
            dot.className = `w-2 h-2 rounded-full transition-all cursor-pointer ${idx === index ? 'w-5 bg-primary' : 'bg-slate-300 dark:bg-slate-700 hover:bg-slate-400'}`;
            dot.title = s.title;
            dot.onclick = () => renderTourStep(idx);
            dotsContainer.appendChild(dot);
        });

        const targetEl = getTargetElement(step);

        if (targetEl) {
            // Scroll target into view if needed
            targetEl.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });

            // Allow short animation delay for scroll to complete
            setTimeout(() => {
                const rect = targetEl.getBoundingClientRect();
                const padding = 8;
                const top = Math.max(0, rect.top - padding);
                const left = Math.max(0, rect.left - padding);
                const width = rect.width + padding * 2;
                const height = rect.height + padding * 2;

                // Move SVG spotlight cutout
                maskCutout.setAttribute('x', left);
                maskCutout.setAttribute('y', top);
                maskCutout.setAttribute('width', width);
                maskCutout.setAttribute('height', height);

                // Move highlight bounding box
                highlightBox.style.top = `${top}px`;
                highlightBox.style.left = `${left}px`;
                highlightBox.style.width = `${width}px`;
                highlightBox.style.height = `${height}px`;
                highlightBox.style.opacity = '1';

                // Position the card relative to target
                positionCardNearTarget(card, rect, step.preferredPosition);
            }, 60);

        } else {
            // Centered Modal (Intro or Finish, or missing target)
            maskCutout.setAttribute('x', '0');
            maskCutout.setAttribute('y', '0');
            maskCutout.setAttribute('width', '0');
            maskCutout.setAttribute('height', '0');

            highlightBox.style.opacity = '0';

            // Center card in screen
            card.style.top = '50%';
            card.style.left = '50%';
            card.style.transform = 'translate(-50%, -50%) scale(1)';
            card.style.opacity = '1';
        }
    }

    function positionCardNearTarget(card, targetRect, preferredPosition = 'bottom') {
        const cardWidth = Math.min(440, window.innerWidth - 32);
        const cardHeight = card.offsetHeight || 260;
        const margin = 16;

        let top = 0;
        let left = 0;

        // Position decisions
        if (preferredPosition === 'right' && (targetRect.right + cardWidth + margin < window.innerWidth)) {
            // Place to the right of target (e.g. sidebar links)
            left = targetRect.right + margin;
            top = Math.max(margin, Math.min(window.innerHeight - cardHeight - margin, targetRect.top - 20));
        } else if (preferredPosition === 'left' && (targetRect.left - cardWidth - margin > 0)) {
            // Place to the left of target
            left = targetRect.left - cardWidth - margin;
            top = Math.max(margin, Math.min(window.innerHeight - cardHeight - margin, targetRect.top - 20));
        } else if (targetRect.bottom + cardHeight + margin < window.innerHeight) {
            // Place below target
            top = targetRect.bottom + margin;
            left = Math.max(margin, Math.min(window.innerWidth - cardWidth - margin, targetRect.left + (targetRect.width / 2) - (cardWidth / 2)));
        } else if (targetRect.top - cardHeight - margin > 0) {
            // Place above target
            top = targetRect.top - cardHeight - margin;
            left = Math.max(margin, Math.min(window.innerWidth - cardWidth - margin, targetRect.left + (targetRect.width / 2) - (cardWidth / 2)));
        } else {
            // Fallback centered
            top = Math.max(margin, (window.innerHeight - cardHeight) / 2);
            left = Math.max(margin, (window.innerWidth - cardWidth) / 2);
        }

        card.style.transform = 'none';
        card.style.top = `${top}px`;
        card.style.left = `${left}px`;
        card.style.opacity = '1';
    }

    function startOnboardingTour() {
        isTourActive = true;
        const root = document.getElementById('onboarding-tour-root');
        if (!root) return;

        root.classList.remove('hidden');
        renderTourStep(0);

        // Add keyboard listener
        window.addEventListener('keydown', handleKeyNav);
    }

    function dismissOnboardingTour(isSkip = false) {
        isTourActive = false;
        const root = document.getElementById('onboarding-tour-root');
        if (root) root.classList.add('hidden');

        window.removeEventListener('keydown', handleKeyNav);

        // Notify backend that user completed/skipped the tour
        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]')?.value 
                       || getCookie('csrftoken');

        fetch('{% url "complete_onboarding_tour" %}', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                'X-CSRFToken': csrfToken || ''
            },
            body: 'completed=1'
        }).catch(err => console.error("Klaida išsaugant turo pabaigą:", err));

        // Clean up url if ?start_tour=1 was present
        if (window.location.search.includes('start_tour=1')) {
            const cleanUrl = window.location.pathname + window.location.search.replace(/[\?&]start_tour=1/, '').replace(/^&/, '?');
            window.history.replaceState({}, document.title, cleanUrl || window.location.pathname);
        }
    }

    function nextTourStep() {
        if (currentStepIndex >= tourSteps.length - 1) {
            dismissOnboardingTour(false);
        } else {
            renderTourStep(currentStepIndex + 1);
        }
    }

    function prevTourStep() {
        if (currentStepIndex > 0) {
            renderTourStep(currentStepIndex - 1);
        }
    }

    function handleKeyNav(e) {
        if (!isTourActive) return;
        if (e.key === 'Escape') {
            dismissOnboardingTour(true);
        } else if (e.key === 'ArrowRight' || e.key === 'Enter') {
            nextTourStep();
        } else if (e.key === 'ArrowLeft') {
            prevTourStep();
        }
    }

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    // Expose global methods
    window.startOnboardingTour = startOnboardingTour;
    window.dismissOnboardingTour = dismissOnboardingTour;
    window.nextTourStep = nextTourStep;
    window.prevTourStep = prevTourStep;

    // Window resize handler to reposition card and spotlight
    window.addEventListener('resize', () => {
        if (isTourActive) {
            renderTourStep(currentStepIndex);
        }
    });

    // Auto-launch condition:
    // If not completed yet OR force requested via URL (?start_tour=1)
    document.addEventListener('DOMContentLoaded', () => {
        if (!userCompletedTour || forceStart) {
            // Only auto-start on home page or if explicitly forced
            const isHomePage = window.location.pathname === '/' || window.location.pathname === '/home/' || window.location.pathname.endsWith('/home');
            if (isHomePage || forceStart) {
                setTimeout(startOnboardingTour, 600);
            }
        }
    });
})();
</script>
{% endif %}
